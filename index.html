<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Yina — XV Años</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{
  background:radial-gradient(circle,#8c1225 0%,#450713 48%,#150106 100%);
  display:flex;align-items:center;justify-content:center;
  font-family:Georgia,serif;
}
.scene{position:relative;width:100vw;height:100dvh;display:flex;align-items:center;justify-content:center;perspective:2200px}
.book{
  position:relative;width:min(94vw,560px);height:min(92vh,840px);
  transform-style:preserve-3d;transform-origin:left center;
  filter:drop-shadow(0 28px 40px rgba(0,0,0,.75));
  z-index:5;
  transition:transform 1.45s cubic-bezier(.65,.02,.18,1),opacity .3s;
}
.book img{width:100%;height:100%;object-fit:contain;display:block;backface-visibility:hidden}
.book.open{
  transform:rotateY(-105deg) translateX(-16%);
}
.book::after{
  content:"";
  position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(105deg,transparent 35%,rgba(255,225,140,.45) 50%,transparent 65%);
  opacity:0;
}
.book.open::after{animation:shine 1s ease}
@keyframes shine{
  0%{opacity:0;transform:translateX(-45%)}
  35%{opacity:1}
  100%{opacity:0;transform:translateX(45%)}
}

.open-btn{
  position:absolute;
  left:50%;bottom:10%;
  transform:translateX(-50%);
  z-index:20;
  border:1px solid rgba(255,222,145,.9);
  border-radius:999px;
  padding:14px 28px;
  background:linear-gradient(180deg,#a91c32,#650718);
  color:#ffe8ad;
  font:700 15px Arial,sans-serif;
  letter-spacing:.14em;
  box-shadow:0 8px 25px rgba(0,0,0,.5),inset 0 0 12px rgba(255,220,120,.15);
  cursor:pointer;
  touch-action:manipulation;
}
.open-btn:active{transform:translateX(-50%) scale(.96)}
.open-btn.hide{opacity:0;pointer-events:none;transition:.2s}

.pages{
  position:absolute;
  width:min(94vw,560px);height:min(92vh,840px);
  transform-style:preserve-3d;
  z-index:4;
  opacity:0;
  pointer-events:none;
}
.page{
  position:absolute;inset:0;
  background:linear-gradient(135deg,#8e1028,#5f0719 55%,#a31932);
  border:3px solid #e6bd62;
  box-shadow:inset 0 0 35px rgba(255,200,80,.22),0 15px 30px rgba(0,0,0,.55);
  transform-origin:left center;
  transform-style:preserve-3d;
}
.page:before{
  content:"";
  position:absolute;inset:3%;
  border:2px solid rgba(255,218,132,.8);
}
.page:after{
  content:"✦     ❦     ✦";
  position:absolute;left:0;right:0;top:50%;
  text-align:center;color:#f4cf79;font-size:34px;
  text-shadow:0 0 15px rgba(255,190,70,.7);
}
.pages.show{opacity:1}
.pages.show .p1{animation:flip .42s .05s both}
.pages.show .p2{animation:flip .42s .30s both}
.pages.show .p3{animation:flip .42s .55s both}
.pages.show .p4{animation:flip .42s .80s both}
.pages.show .p5{animation:flip .42s 1.05s both}
.pages.show .p6{animation:flip .42s 1.30s both}
@keyframes flip{
  0%{transform:rotateY(0deg)}
  45%{transform:rotateY(-95deg)}
  100%{transform:rotateY(-179deg)}
}

.final{
  position:fixed;inset:0;z-index:1;opacity:0;
  transition:opacity .5s;
}
.final img{width:100%;height:100%;object-fit:cover}
.final.show{opacity:1}

@media(max-width:430px){
  .book,.pages{width:96vw;height:94dvh}
}
</style>
</head>
<body>
<div class="scene">
  <div class="final" id="final">
    <img src="paginas-rojas-yina.png" alt="Páginas rojas y doradas">
  </div>

  <div class="pages" id="pages">
    <div class="page p1"></div>
    <div class="page p2"></div>
    <div class="page p3"></div>
    <div class="page p4"></div>
    <div class="page p5"></div>
    <div class="page p6"></div>
  </div>

  <div class="book" id="book">
    <img src="libro-yina.png" alt="Yina XV Años">
  </div>

  <button class="open-btn" id="openBtn">ABRIR AQUÍ</button>
</div>

<script>
const book=document.getElementById('book');
const pages=document.getElementById('pages');
const finalPage=document.getElementById('final');
const btn=document.getElementById('openBtn');
let opened=false;

function openBook(){
  if(opened)return;
  opened=true;
  btn.classList.add('hide');

  // 1. La portada se abre de forma muy visible.
  book.classList.add('open');

  // 2. Varias hojas pasan rápidamente.
  setTimeout(()=>pages.classList.add('show'),1100);

  // 3. Se muestra el interior rojo/dorado.
  setTimeout(()=>finalPage.classList.add('show'),2800);

  // 4. Entrada a la invitación real.
  setTimeout(()=>{
    window.location.href='https://xn--invitacin-isabel-y-david-nmc.my.canva.site/quince-a-os-yinna';
  },3700);
}

btn.addEventListener('click',openBook);
btn.addEventListener('touchend',function(e){e.preventDefault();openBook()});
book.addEventListener('click',openBook);
</script>
</body>
</html>
