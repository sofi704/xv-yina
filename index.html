<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Yina — XV Años</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{
  background:radial-gradient(circle at 50% 45%,#8d1428 0%,#470711 48%,#160106 100%);
  display:flex;align-items:center;justify-content:center;
}
.scene{
  position:relative;width:100vw;height:100dvh;
  display:flex;align-items:center;justify-content:center;
  perspective:2200px;overflow:hidden;
}
.glow{
  position:absolute;width:90vmin;height:90vmin;border-radius:50%;
  background:radial-gradient(circle,rgba(255,205,115,.18),transparent 68%);
  filter:blur(12px);pointer-events:none;
}
.book-wrap{
  position:relative;
  width:min(94vw,560px);
  height:min(92vh,840px);
  display:flex;align-items:center;justify-content:center;
}
.book{
  position:relative;width:100%;height:100%;
  transform-style:preserve-3d;
  transform-origin:left center;
  transition:transform 1.6s cubic-bezier(.72,.02,.16,1);
  filter:drop-shadow(0 28px 40px rgba(0,0,0,.75));
  z-index:5;
}
.book.open{transform:rotateY(-108deg) translateX(-5%)}
.cover{
  position:absolute;inset:0;width:100%;height:100%;
  object-fit:contain;display:block;
  user-select:none;-webkit-user-drag:none;
  backface-visibility:hidden;
}
.shine{
  position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(105deg,transparent 35%,rgba(255,225,150,.38) 50%,transparent 65%);
  opacity:0;
}
.book.open .shine{animation:shine 1.15s ease}
@keyframes shine{
  0%{opacity:0;transform:translateX(-45%)}
  35%{opacity:1}
  100%{opacity:0;transform:translateX(45%)}
}

/* Invisible hotspot placed EXACTLY over the "ABRIR AQUÍ"
   printed on the original cover. */
.cover-hotspot{
  position:absolute;
  left:29%;
  top:70.5%;
  width:43%;
  height:10.5%;
  z-index:20;
  border:0;
  padding:0;
  margin:0;
  background:transparent;
  cursor:pointer;
  border-radius:50px;
  touch-action:manipulation;
}

/* During the opening the hotspot must not block the animation. */
.cover-hotspot.hidden{pointer-events:none}

.hint{
  position:absolute;
  left:50%;bottom:1.5%;
  transform:translateX(-50%);
  color:#ffe9ad;
  font:600 11px Arial,sans-serif;
  letter-spacing:.1em;
  text-transform:uppercase;
  text-shadow:0 2px 10px #000;
  opacity:.8;
  pointer-events:none;
  z-index:30;
}

.fade{
  position:fixed;inset:0;z-index:50;
  background:#170006;opacity:0;pointer-events:none;
  transition:opacity .35s;
}
body.opening .fade{opacity:.25}

@media(max-width:430px){
  .book-wrap{width:96vw;height:94dvh}
}
@media(max-height:650px){
  .book-wrap{width:86vw;height:92dvh}
}
</style>
</head>
<body>
<div class="scene">
  <div class="glow"></div>
  <div class="book-wrap">
    <div class="book" id="book">
      <img class="cover" src="libro-yina.png" alt="Yina XV Años">
      <div class="shine"></div>
      <button class="cover-hotspot" id="openButton" aria-label="Abrir aquí"></button>
      <div class="hint">Toca “ABRIR AQUÍ”</div>
    </div>
  </div>
</div>
<div class="fade"></div>

<script>
const book=document.getElementById('book');
const button=document.getElementById('openButton');
let opened=false;

function openBook(e){
  if(e)e.preventDefault();
  if(opened)return;
  opened=true;
  button.classList.add('hidden');
  document.body.classList.add('opening');
  book.classList.add('open');

  // Directamente a TU página web de Canva, sin páginas intermedias.
  setTimeout(function(){
    window.location.href='https://xn--invitacin-isabel-y-david-nmc.my.canva.site/quince-a-os-yinna';
  },1700);
}

button.addEventListener('click',openBook);
button.addEventListener('touchend',openBook,{passive:false});
</script>
</body>
</html>
