<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Yina — XV Años</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{
  background:
    radial-gradient(circle at 50% 45%,#8d1326 0%,#450711 48%,#160106 100%);
  display:flex;
  align-items:center;
  justify-content:center;
  font-family:Georgia,"Times New Roman",serif;
}
.scene{
  position:relative;
  width:100vw;
  height:100dvh;
  display:flex;
  align-items:center;
  justify-content:center;
  perspective:2200px;
  overflow:hidden;
}
.glow{
  position:absolute;
  width:90vmin;
  height:90vmin;
  border-radius:50%;
  background:radial-gradient(circle,rgba(255,200,105,.18),transparent 68%);
  filter:blur(12px);
  pointer-events:none;
}

/* This is the ORIGINAL cover. It is not recreated or redesigned. */
.book{
  position:relative;
  width:min(94vw,560px);
  height:min(92vh,840px);
  transform-style:preserve-3d;
  transform-origin:left center;
  filter:drop-shadow(0 28px 40px rgba(0,0,0,.75));
  transition:transform 1.55s cubic-bezier(.72,.02,.16,1);
  z-index:5;
}
.book img{
  width:100%;
  height:100%;
  object-fit:contain;
  display:block;
  user-select:none;
  -webkit-user-drag:none;
  backface-visibility:hidden;
}
.book.open{
  transform:rotateY(-105deg) translateX(-7%);
}

/* Subtle page-edge impression behind the original cover.
   It contains NO text and NO extra Yinna page. */
.book::before{
  content:"";
  position:absolute;
  left:49.5%;
  top:1%;
  width:49%;
  height:98%;
  z-index:-1;
  border-radius:2px 5px 5px 2px;
  background:
    linear-gradient(90deg,#f0dfb9,#fff6e1 48%,#d7c29c);
  box-shadow:8px 0 18px rgba(0,0,0,.28);
  transform-origin:left center;
  opacity:0;
  transition:opacity .15s ease;
}
.book.open::before{
  opacity:1;
}

/* Soft shine during the opening */
.shine{
  position:absolute;
  inset:0;
  pointer-events:none;
  background:linear-gradient(
    105deg,
    transparent 35%,
    rgba(255,225,150,0) 44%,
    rgba(255,225,150,.38) 50%,
    rgba(255,225,150,0) 56%,
    transparent 65%
  );
  opacity:0;
}
.book.open .shine{
  animation:shine 1.15s ease-in-out;
}
@keyframes shine{
  0%{opacity:0;transform:translateX(-45%)}
  35%{opacity:1}
  100%{opacity:0;transform:translateX(45%)}
}

.open-button{
  position:absolute;
  left:50%;
  bottom:9%;
  transform:translateX(-50%);
  z-index:20;
  padding:13px 28px;
  border:1px solid #f0cc77;
  border-radius:999px;
  background:linear-gradient(180deg,#a71932,#620716);
  color:#ffe9ad;
  font:700 14px Arial,sans-serif;
  letter-spacing:.15em;
  box-shadow:0 8px 25px rgba(0,0,0,.55);
  cursor:pointer;
  touch-action:manipulation;
}
.open-button.hide{
  opacity:0;
  pointer-events:none;
  transition:opacity .2s ease;
}

.fade{
  position:fixed;
  inset:0;
  z-index:30;
  background:#170006;
  opacity:0;
  pointer-events:none;
  transition:opacity .45s ease;
}
body.go .fade{opacity:.25}

@media(max-width:430px){
  .book{width:96vw;height:94dvh}
}
@media(max-height:650px){
  .book{width:86vw;height:92dvh}
}
</style>
</head>
<body>
<div class="scene">
  <div class="glow"></div>

  <div class="book" id="book">
    <img src="libro-yina.png" alt="Yina — XV Años">
    <div class="shine"></div>
    <button class="open-button" id="openButton">ABRIR AQUÍ</button>
  </div>
</div>

<div class="fade"></div>

<script>
const book = document.getElementById('book');
const button = document.getElementById('openButton');
let opened = false;

function openInvitation(e){
  if(e) e.preventDefault();
  if(opened) return;
  opened = true;

  button.classList.add('hide');
  document.body.classList.add('go');

  // La portada original se abre hacia la izquierda.
  book.classList.add('open');

  // No hay página intermedia: al terminar la animación,
  // entra directamente a la página web real de Canva.
  setTimeout(() => {
    window.location.href =
      'https://xn--invitacin-isabel-y-david-nmc.my.canva.site/quince-a-os-yinna';
  }, 1550);
}

button.addEventListener('click', openInvitation);
button.addEventListener('touchend', openInvitation);
</script>
</body>
</html>
