<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Yina — XV Años</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{
  background:radial-gradient(circle at 50% 44%,#8d1428 0%,#470711 48%,#160106 100%);
}
.scene{
  position:relative;width:100vw;height:100dvh;
  display:flex;align-items:center;justify-content:center;
  perspective:1600px;overflow:hidden;
}
.book{
  position:relative;
  width:min(92vw,560px);
  height:min(90vh,820px);
  transform-style:preserve-3d;
}

/* PÁGINAS ROJAS: ya no son blancas */
.page-block{
  position:absolute;
  left:12%;top:2%;
  width:86%;height:96%;
  z-index:1;
  overflow:hidden;
  border-radius:2px 7px 7px 2px;
  background:
    radial-gradient(circle at 45% 42%,#a91a35 0%,#86102a 38%,#68091f 72%,#4a0615 100%);
  border:2px solid #d6a84f;
  box-shadow:
    10px 8px 22px rgba(0,0,0,.48),
    inset 0 0 35px rgba(255,210,110,.20);
}

/* Elegante marco dorado */
.page-block:before{
  content:"";
  position:absolute;
  inset:3%;
  border:2px solid rgba(238,195,98,.88);
  box-shadow:
    inset 0 0 22px rgba(255,215,120,.10),
    0 0 10px rgba(0,0,0,.12);
}

/* Ornamento central sutil */
.page-block:after{
  content:"✦   ❦   ✦";
  position:absolute;
  left:0;right:0;top:50%;
  transform:translateY(-50%);
  text-align:center;
  color:rgba(246,207,116,.78);
  font-size:27px;
  letter-spacing:.28em;
  text-shadow:0 0 14px rgba(255,190,70,.4);
}

/* Borde de hojas rojas/doradas en el canto */
.page-edge{
  position:absolute;
  right:0;top:2%;
  width:10px;height:96%;
  z-index:4;
  background:
    repeating-linear-gradient(
      0deg,
      #5a0718 0px,#a81934 3px,#e0b35b 5px,#7a0b20 7px
    );
  box-shadow:-2px 0 8px rgba(0,0,0,.35);
}

/* Portada original */
.cover{
  position:absolute;left:0;top:0;
  width:100%;height:100%;
  object-fit:contain;
  transform-origin:left center;
  transform-style:preserve-3d;
  z-index:10;
  display:block;
  user-select:none;
  -webkit-user-drag:none;
  backface-visibility:hidden;
  -webkit-backface-visibility:hidden;
  filter:drop-shadow(0 25px 35px rgba(0,0,0,.72));
  transition:transform 1.8s cubic-bezier(.65,.04,.18,1),filter 1.8s ease;
}
.cover.open{
  transform:rotateY(-58deg) translateX(-4%) scaleX(.98);
  filter:drop-shadow(12px 18px 22px rgba(0,0,0,.48));
}

/* Sombra de la tapa */
.turn-shadow{
  position:absolute;
  left:8%;top:0;width:88%;height:100%;
  z-index:11;pointer-events:none;
  transform-origin:left center;
  opacity:0;
  background:linear-gradient(90deg,rgba(0,0,0,.62),rgba(0,0,0,.20) 24%,transparent 55%);
}
.cover.open + .turn-shadow{
  animation:shadowOpen 1.8s cubic-bezier(.65,.04,.18,1) forwards;
}
@keyframes shadowOpen{
  0%{opacity:0;transform:rotateY(0)}
  18%{opacity:.62}
  55%{opacity:.36}
  100%{opacity:.18;transform:rotateY(-58deg)}
}

/* El botón es invisible: funciona sobre el "ABRIR AQUÍ" de la portada */
.tap{
  position:absolute;
  left:28%;top:68%;
  width:46%;height:14%;
  z-index:30;
  border:0;background:transparent;
  padding:0;margin:0;
  cursor:pointer;
  touch-action:manipulation;
}
.fade{
  position:fixed;inset:0;z-index:50;
  background:#170006;opacity:0;
  pointer-events:none;transition:opacity .4s;
}
body.opening .fade{opacity:.18}

@media(max-width:430px){
  .book{width:96vw;height:94dvh}
}
@media(max-height:650px){
  .book{width:86vw;height:92dvh}
}
</style>
</head>
<body>
<div class="scene">
  <div class="book">
    <div class="page-block"></div>
    <div class="page-edge"></div>

    <img id="cover" class="cover" src="libro-yina.png" alt="Yina — XV Años">
    <div class="turn-shadow"></div>

    <button id="tap" class="tap" aria-label="Abrir aquí"></button>
  </div>
</div>
<div class="fade"></div>

<script>
const cover=document.getElementById("cover");
const tap=document.getElementById("tap");
let opened=false;

function openBook(e){
  if(e)e.preventDefault();
  if(opened)return;
  opened=true;
  tap.style.pointerEvents="none";
  document.body.classList.add("opening");
  cover.classList.add("open");

  setTimeout(function(){
    window.location.href="https://xn--invitacin-isabel-y-david-nmc.my.canva.site/quince-a-os-yinna";
  },2050);
}
tap.addEventListener("click",openBook);
tap.addEventListener("touchend",openBook,{passive:false});
cover.addEventListener("click",openBook);
</script>
</body>
</html>
