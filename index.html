<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Yina — XV Años</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{
  background:
    radial-gradient(circle at 50% 44%,#8e1428 0%,#470711 48%,#160106 100%);
}
.scene{
  position:relative;width:100vw;height:100dvh;
  display:flex;align-items:center;justify-content:center;
  perspective:1600px;overflow:hidden;
}

/* The visible page block behind the cover */
.book{
  position:relative;
  width:min(92vw,560px);
  height:min(90vh,820px);
  transform-style:preserve-3d;
}

/* Pages remain fixed, just like the block visible behind the cover
   in the reference video. */
.page-block{
  position:absolute;
  left:12%;
  top:2%;
  width:86%;
  height:96%;
  border-radius:2px 7px 7px 2px;
  z-index:1;
  background:
    repeating-linear-gradient(
      0deg,
      #eadcbf 0px,
      #fff7e6 2px,
      #d1bf99 4px,
      #f8ebd2 6px
    );
  box-shadow:
    10px 8px 20px rgba(0,0,0,.42),
    inset 0 0 25px rgba(120,65,20,.16);
}

/* Decorative red/gold inner page, visible only at the opening edge */
.page-block:before{
  content:"";
  position:absolute;
  left:2%;right:4%;top:2%;bottom:2%;
  border:2px solid rgba(177,27,48,.58);
  border-radius:2px 6px 6px 2px;
}
.page-block:after{
  content:"";
  position:absolute;
  right:0;top:2%;bottom:2%;
  width:9px;
  background:repeating-linear-gradient(
    0deg,#d0bd96 0,#fff5dc 2px,#b9a77e 4px
  );
}

/* The original cover is kept as ONE image.
   It tilts open from its left edge, matching the reference. */
.cover{
  position:absolute;
  left:0;top:0;
  width:100%;height:100%;
  object-fit:contain;
  transform-origin:left center;
  transform-style:preserve-3d;
  z-index:10;
  display:block;
  user-select:none;
  -webkit-user-drag:none;
  backface-visibility:hidden;
  -webkit-backface-visibility:hidden;
  filter:drop-shadow(0 25px 35px rgba(0,0,0,.72));
  transition:
    transform 1.8s cubic-bezier(.65,.04,.18,1),
    filter 1.8s ease;
}

/* This is the important part:
   the cover remains visible and only opens about 58 degrees. */
.cover.open{
  transform:
    rotateY(-58deg)
    translateX(-4%)
    scaleX(.98);
  filter:drop-shadow(12px 18px 22px rgba(0,0,0,.48));
}

/* A moving shadow between the cover and page block */
.turn-shadow{
  position:absolute;
  left:8%;top:0;
  width:88%;height:100%;
  z-index:11;
  pointer-events:none;
  transform-origin:left center;
  opacity:0;
  background:linear-gradient(
    90deg,
    rgba(0,0,0,.62) 0%,
    rgba(0,0,0,.28) 18%,
    transparent 55%
  );
}
.cover.open + .turn-shadow{
  animation:shadowOpen 1.8s cubic-bezier(.65,.04,.18,1) forwards;
}
@keyframes shadowOpen{
  0%{opacity:0;transform:rotateY(0)}
  18%{opacity:.62}
  55%{opacity:.38}
  100%{opacity:.18;transform:rotateY(-58deg)}
}

/* Gentle page-edge movement, not a fake extra page */
.page-edge{
  position:absolute;
  left:11%;top:3%;
  width:2px;height:94%;
  background:#c8b58b;
  z-index:3;
  opacity:.8;
}

/*
  No visible button is added.
  The click/touch layer covers the printed "ABRIR AQUÍ"
  on the ORIGINAL image.
*/
.tap{
  position:absolute;
  left:28%;
  top:68%;
  width:46%;
  height:14%;
  z-index:30;
  border:0;
  background:transparent;
  padding:0;
  margin:0;
  cursor:pointer;
  touch-action:manipulation;
}

.fade{
  position:fixed;inset:0;z-index:50;
  background:#170006;opacity:0;
  pointer-events:none;
  transition:opacity .45s;
}
body.opening .fade{opacity:.18}

@media(max-width:430px){
  .book{width:96vw;height:94dvh}
}
@media(max-height:650px){
  .book{width:86vw;height:92dvh}
}
</style>
</head>
<body>
<div class="scene">
  <div class="book">

    <div class="page-block"></div>
    <div class="page-edge"></div>

    <img id="cover"
         class="cover"
         src="libro-yina.png"
         alt="Yina — XV Años">

    <div class="turn-shadow"></div>

    <!-- Invisible hit area exactly over the printed ABRIR AQUÍ -->
    <button id="tap" class="tap" aria-label="Abrir aquí"></button>

  </div>
</div>
<div class="fade"></div>

<script>
const cover=document.getElementById("cover");
const tap=document.getElementById("tap");
let opened=false;

function openBook(e){
  if(e)e.preventDefault();
  if(opened)return;
  opened=true;

  tap.style.pointerEvents="none";
  document.body.classList.add("opening");

  // Reference-style opening: the cover stays visible,
  // tilts left, and reveals the page block on the right.
  cover.classList.add("open");

  // Then open the REAL Canva invitation.
  setTimeout(function(){
    window.location.href=
      "https://xn--invitacin-isabel-y-david-nmc.my.canva.site/quince-a-os-yinna";
  },2050);
}

tap.addEventListener("click",openBook);
tap.addEventListener("touchend",openBook,{passive:false});

/* Also let the whole cover work on touch in case the invisible
   hotspot misses slightly on a different screen size. */
cover.addEventListener("click",openBook);
</script>
</body>
</html>
