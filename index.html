<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Yina — XV Años</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{
  background:
    radial-gradient(circle at 50% 43%,#8f1428 0%,#480711 48%,#160106 100%);
}
.scene{
  position:relative;
  width:100vw;
  height:100dvh;
  display:flex;
  align-items:center;
  justify-content:center;
  perspective:2200px;
  overflow:hidden;
}

/* Interior behind the cover: only a subtle red book/page surface.
   It is NOT an extra image and contains no "Yinna" text. */
.inside{
  position:absolute;
  width:min(94vw,560px);
  height:min(92vh,840px);
  border-radius:5px;
  background:
    radial-gradient(circle at 50% 45%,#94142b 0%,#69091e 65%,#450512 100%);
  box-shadow:
    inset 0 0 45px rgba(255,210,120,.18),
    0 25px 45px rgba(0,0,0,.55);
  overflow:hidden;
}
.inside:before{
  content:"";
  position:absolute;
  left:3%;right:3%;top:3%;bottom:3%;
  border:2px solid rgba(235,194,105,.55);
}
.inside:after{
  content:"";
  position:absolute;
  left:50%;top:2%;bottom:2%;width:4px;
  transform:translateX(-50%);
  background:linear-gradient(90deg,#3a030d,#d2a34e,#500615);
  box-shadow:0 0 14px rgba(0,0,0,.45);
}

.book-wrap{
  position:relative;
  width:min(94vw,560px);
  height:min(92vh,840px);
  transform-style:preserve-3d;
  z-index:5;
}

.cover{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:contain;
  display:block;
  transform-origin:left center;
  transform-style:preserve-3d;
  backface-visibility:hidden;
  -webkit-backface-visibility:hidden;
  user-select:none;
  -webkit-user-drag:none;
  cursor:pointer;
  transition:transform 2.1s cubic-bezier(.72,.01,.15,1);
  filter:drop-shadow(0 25px 34px rgba(0,0,0,.72));
}

/* This is the actual book-opening movement. */
.cover.open{
  transform:rotateY(-165deg);
}

/* Moving shadow makes the hinge/page-turn easier to see. */
.turn-shadow{
  position:absolute;
  inset:0;
  pointer-events:none;
  z-index:8;
  transform-origin:left center;
  opacity:0;
  background:linear-gradient(90deg,rgba(0,0,0,.58),transparent 55%);
}
.cover.open + .turn-shadow{
  animation:turnShadow 2.1s cubic-bezier(.72,.01,.15,1) forwards;
}
@keyframes turnShadow{
  0%{opacity:0;transform:rotateY(0deg)}
  18%{opacity:.55}
  55%{opacity:.28}
  100%{opacity:0;transform:rotateY(-165deg)}
}

/* Shine only during the turn */
.shine{
  position:absolute;
  inset:0;
  pointer-events:none;
  z-index:9;
  opacity:0;
  background:linear-gradient(105deg,transparent 35%,rgba(255,225,150,.42) 50%,transparent 65%);
}
.cover.open ~ .shine{
  animation:shine 1.45s ease-in-out;
}
@keyframes shine{
  0%{opacity:0;transform:translateX(-45%)}
  30%{opacity:1}
  100%{opacity:0;transform:translateX(45%)}
}

/*
  IMPORTANT:
  There is NO visible HTML button.
  The "ABRIR AQUÍ" button printed inside the original cover is the button.
  The whole cover is clickable so the printed button always works on phones.
*/
.tap-area{
  position:absolute;
  inset:0;
  z-index:20;
  border:0;
  padding:0;
  margin:0;
  background:transparent;
  cursor:pointer;
  touch-action:manipulation;
}

/* A short fade at the end before opening Canva. */
.fade{
  position:fixed;
  inset:0;
  z-index:50;
  background:#170006;
  opacity:0;
  pointer-events:none;
  transition:opacity .45s ease;
}
body.opening .fade{opacity:.32}

@media(max-width:430px){
  .inside,.book-wrap{width:96vw;height:94dvh}
}
@media(max-height:650px){
  .inside,.book-wrap{width:86vw;height:92dvh}
}
</style>
</head>
<body>
<div class="scene">

  <div class="inside"></div>

  <div class="book-wrap">
    <!-- EXACT original cover: no redesign and no added visible button -->
    <img class="cover" id="cover" src="libro-yina.png" alt="Yina — XV Años">
    <div class="turn-shadow"></div>
    <div class="shine"></div>

    <!-- Invisible clickable layer over the original printed ABRIR AQUÍ.
         It covers the whole cover intentionally so it cannot miss on mobile. -->
    <button class="tap-area" id="tapArea" aria-label="Abrir aquí"></button>
  </div>

</div>

<div class="fade"></div>

<script>
const cover = document.getElementById("cover");
const tap = document.getElementById("tapArea");
let opened = false;

function openBook(e){
  if(e) e.preventDefault();
  if(opened) return;
  opened = true;

  tap.disabled = true;
  tap.style.pointerEvents = "none";
  document.body.classList.add("opening");

  // Real, visible hinge/page-opening animation.
  cover.classList.add("open");

  // After the animation, go directly to the user's Canva website.
  setTimeout(function(){
    window.location.href =
      "https://xn--invitacin-isabel-y-david-nmc.my.canva.site/quince-a-os-yinna";
  }, 2350);
}

tap.addEventListener("click", openBook);
tap.addEventListener("touchend", openBook, {passive:false});
</script>
</body>
</html>
