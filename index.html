<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Yina — XV Años</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin:0; width:100%; height:100%; overflow:hidden; }
  body {
    background:
      radial-gradient(circle at 50% 45%, #6e0a16 0%, #30030a 55%, #100006 100%);
    display:flex; align-items:center; justify-content:center;
    font-family: Georgia, "Times New Roman", serif;
  }
  .scene {
    position:relative;
    width:min(100vw, 520px);
    height:100vh;
    max-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    perspective:1800px;
  }
  .book {
    position:relative;
    width:min(92vw, 460px);
    aspect-ratio:2/3;
    transform-style:preserve-3d;
    transform-origin:left center;
    transition:transform 1.15s cubic-bezier(.65,.02,.2,1);
    filter:drop-shadow(0 24px 28px rgba(0,0,0,.55));
    will-change:transform;
  }
  .book img {
    width:100%; height:100%; display:block;
    object-fit:cover;
    border-radius:2px 10px 10px 2px;
    backface-visibility:hidden;
    -webkit-backface-visibility:hidden;
    user-select:none;
    -webkit-user-drag:none;
  }
  .book::after {
    content:"";
    position:absolute; inset:0;
    background:linear-gradient(90deg, rgba(0,0,0,.30), transparent 18%, transparent 78%, rgba(255,255,255,.10));
    pointer-events:none;
    border-radius:2px 10px 10px 2px;
  }
  .page-edge {
    position:absolute; top:1%; right:-7px; width:10px; height:98%;
    border-radius:0 6px 6px 0;
    background:repeating-linear-gradient(to bottom,#e8d5aa 0 3px,#b99b67 3px 5px);
    opacity:.8;
    transform:translateZ(-2px);
  }
  .tap {
    position:absolute;
    left:50%; bottom:8%;
    transform:translateX(-50%);
    width:56%; height:10%;
    background:transparent;
    border:0;
    cursor:pointer;
    z-index:5;
    border-radius:30px;
  }
  .tap:focus-visible { outline:3px solid #fff; outline-offset:5px; }
  .hint {
    position:absolute; bottom:2.5%;
    color:#f9e4a9; font:600 13px/1.2 Arial,sans-serif;
    letter-spacing:.12em; text-transform:uppercase;
    text-shadow:0 2px 8px #000;
    opacity:.85;
    pointer-events:none;
  }
  .veil {
    position:fixed; inset:0; background:#210006;
    opacity:0; pointer-events:none; transition:opacity .35s ease;
    z-index:10;
  }
  .opening .book { transform:rotateY(-78deg); }
  .opening .veil { opacity:.18; }
  @media (max-height:700px) {
    .book { width:min(82vw, 390px); }
  }
</style>
</head>
<body>
  <main class="scene" id="scene" aria-label="Invitación de XV años">
    <div class="book" id="book">
      <img src="libro-yina.png" alt="Libro de invitación de Yina, XV Años">
      <div class="page-edge"></div>
      <button class="tap" id="openBtn" aria-label="Abrir aquí"></button>
    </div>
    <div class="hint">Toca “Abrir aquí”</div>
  </main>
  <div class="veil"></div>

<script>
  const scene = document.getElementById('scene');
  const btn = document.getElementById('openBtn');

  btn.addEventListener('click', () => {
    scene.classList.add('opening');
    btn.disabled = true;

    // Cuando termina la apertura, entra al sitio web real de la invitación.
    setTimeout(() => {
      window.location.href = 'https://canva.link/v7riolfc923rb95';
    }, 1150);
  });
</script>
</body>
</html>
