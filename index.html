<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Yina — XV Años</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{
  background:radial-gradient(circle at 50% 44%,#8d1428 0%,#470711 52%,#160106 100%);
}
.scene{
  position:relative;
  width:100vw;height:100dvh;
  display:flex;align-items:center;justify-content:center;
  perspective:1600px;
  overflow:hidden;
}
.book{
  position:relative;
  width:min(94vw,560px);
  height:min(94dvh,840px);
  max-width:560px;
  max-height:840px;
  transform-style:preserve-3d;
}

/* The red/gold interior is completely hidden while the book is closed.
   This prevents any rectangle/border from sticking out on mobile. */
.page-block{
  position:absolute;
  left:0;top:0;
  width:100%;height:100%;
  z-index:1;
  border-radius:5px;
  overflow:hidden;
  opacity:0;
  background:
    radial-gradient(circle at 50% 45%,#a91a35 0%,#851029 42%,#62091d 72%,#460512 100%);
  border:2px solid #d6a84f;
  box-shadow:inset 0 0 38px rgba(255,210,110,.20);
  transition:opacity .18s ease;
}
.page-block.visible{opacity:1}
.page-block:before{
  content:"";
  position:absolute;
  inset:3%;
  border:2px solid rgba(238,195,98,.88);
}
.page-block:after{
  content:"✦   ❦   ✦";
  position:absolute;
  left:0;right:0;top:50%;
  transform:translateY(-50%);
  text-align:center;
  color:rgba(246,207,116,.78);
  font-size:27px;
  letter-spacing:.28em;
}
.page-edge{
  position:absolute;
  right:1.2%;top:3%;
  width:8px;height:94%;
  z-index:3;
  opacity:0;
  background:repeating-linear-gradient(
    0deg,#5a0718 0,#a81934 3px,#e0b35b 5px,#7a0b20 7px
  );
  transition:opacity .18s ease;
}
.page-edge.visible{opacity:.9}

/* Original cover: unchanged */
.cover{
  position:absolute;
  left:0;top:0;
  width:100%;height:100%;
  object-fit:contain;
  transform-origin:left center;
  transform-style:preserve-3d;
  z-index:10;
  display:block;
  user-select:none;
  -webkit-user-drag:none;
  backface-visibility:hidden;
  -webkit-backface-visibility:hidden;
  filter:drop-shadow(0 25px 35px rgba(0,0,0,.72));
  transition:transform 1.8s cubic-bezier(.65,.04,.18,1),filter 1.8s ease;
}
.cover.open{
  transform:rotateY(-58deg) translateX(-4%) scaleX(.98);
  filter:drop-shadow(12px 18px 22px rgba(0,0,0,.48));
}

/* Soft shadow under the opening cover */
.turn-shadow{
  position:absolute;
  left:0;top:0;width:100%;height:100%;
  z-index:11;
  pointer-events:none;
  transform-origin:left center;
  opacity:0;
  background:linear-gradient(90deg,rgba(0,0,0,.58),rgba(0,0,0,.16) 28%,transparent 58%);
}
.cover.open + .turn-shadow{
  animation:shadowOpen 1.8s cubic-bezier(.65,.04,.18,1) forwards;
}
@keyframes shadowOpen{
  0%{opacity:0;transform:rotateY(0)}
  18%{opacity:.58}
  55%{opacity:.34}
  100%{opacity:.14;transform:rotateY(-58deg)}
}

/* Invisible hit area: the visible "ABRIR AQUÍ" is part of the original image. */
.tap{
  position:absolute;
  left:27%;top:67%;
  width:48%;height:15%;
  z-index:30;
  border:0;background:transparent;
  padding:0;margin:0;
  cursor:pointer;
  touch-action:manipulation;
}

@media(max-width:430px){
  .book{
    width:100vw;
    height:100dvh;
  }
  .page-block{
    /* Exact viewport-sized backing, but hidden until opening. */
    border-radius:0;
  }
}
@media(min-width:431px){
  .book{width:min(94vw,560px);height:min(94vh,840px)}
}
</style>
</head>
<body>
<div class="scene">
  <div class="book">
    <div class="page-block" id="pageBlock"></div>
    <div class="page-edge" id="pageEdge"></div>

    <img id="cover" class="cover" src="libro-yina.png" alt="Yina — XV Años">
    <div class="turn-shadow"></div>

    <button id="tap" class="tap" aria-label="Abrir aquí"></button>
  </div>
</div>

<script>
const cover=document.getElementById("cover");
const tap=document.getElementById("tap");
const pageBlock=document.getElementById("pageBlock");
const pageEdge=document.getElementById("pageEdge");
let opened=false;

function openBook(e){
  if(e)e.preventDefault();
  if(opened)return;
  opened=true;
  tap.style.pointerEvents="none";

  // Only now reveal the red/gold interior.
  pageBlock.classList.add("visible");
  pageEdge.classList.add("visible");

  // The original cover opens from the left like the reference.
  cover.classList.add("open");

  // Directly to the real Canva invitation; no intermediate page.
  setTimeout(function(){
    window.location.href="https://xn--invitacin-isabel-y-david-nmc.my.canva.site/quince-a-os-yinna";
  },2050);
}

tap.addEventListener("click",openBook);
tap.addEventListener("touchend",openBook,{passive:false});
cover.addEventListener("click",openBook);
</script>
</body>
</html>
