<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yina — XV Años</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{
  background:radial-gradient(circle at center,#8e1428 0%,#470711 52%,#160106 100%);
  font-family:Georgia,"Times New Roman",serif;
}
.scene{
  width:100vw;height:100vh;height:100dvh;
  position:relative;
  display:flex;
  align-items:center;
  justify-content:center;
  perspective:1800px;
  overflow:hidden;
}
.glow{
  position:absolute;
  width:90vmin;height:90vmin;
  border-radius:50%;
  background:radial-gradient(circle,rgba(255,200,100,.20),transparent 68%);
  filter:blur(10px);
  pointer-events:none;
}
.book-area{
  position:relative;
  width:min(92vw,560px);
  height:min(88vh,820px);
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:2;
}
.book{
  width:100%;
  height:100%;
  position:relative;
  transform-style:preserve-3d;
  transform-origin:left center;
  transition:transform 1.65s cubic-bezier(.72,.02,.16,1);
  filter:drop-shadow(0 28px 38px rgba(0,0,0,.75));
}
.book-cover{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:contain;
  display:block;
  user-select:none;
  -webkit-user-drag:none;
  pointer-events:none;
  backface-visibility:hidden;
}
.book.open{
  transform:rotateY(-115deg) translateX(-5%);
}

/* A subtle inner page edge appears behind the cover only during the turn. */
.book::after{
  content:"";
  position:absolute;
  z-index:-1;
  left:49.5%;
  top:2%;
  width:49%;
  height:96%;
  border-radius:0 5px 5px 0;
  background:linear-gradient(90deg,#ead9b4,#fff6df 45%,#d2bd94);
  box-shadow:7px 0 18px rgba(0,0,0,.35);
  opacity:0;
  transition:opacity .15s;
}
.book.open::after{opacity:1}

/* shine */
.shine{
  position:absolute;
  inset:0;
  pointer-events:none;
  background:linear-gradient(105deg,transparent 34%,rgba(255,225,150,.42) 50%,transparent 66%);
  opacity:0;
}
.book.open .shine{animation:shine 1.2s ease}
@keyframes shine{
  0%{opacity:0;transform:translateX(-40%)}
  30%{opacity:1}
  100%{opacity:0;transform:translateX(40%)}
}

/* Button is OUTSIDE the transformed book so it always receives the tap. */
.open-button{
  position:fixed;
  left:50%;
  bottom:6vh;
  transform:translateX(-50%);
  z-index:100;
  border:1px solid #f2ce79;
  border-radius:999px;
  padding:14px 30px;
  background:linear-gradient(180deg,#aa1933,#600716);
  color:#ffe9ad;
  font-family:Arial,sans-serif;
  font-size:14px;
  font-weight:700;
  letter-spacing:.16em;
  box-shadow:0 8px 28px rgba(0,0,0,.60);
  cursor:pointer;
  pointer-events:auto;
  touch-action:manipulation;
}
.open-button:active{
  transform:translateX(-50%) scale(.96);
}
.open-button.hide{
  opacity:0;
  pointer-events:none;
  transition:opacity .2s;
}

/* Prevents any old/intermediate page from being shown. */
.cover-screen{
  position:fixed;
  inset:0;
  z-index:1;
  pointer-events:none;
}
.fade{
  position:fixed;
  inset:0;
  background:#170006;
  opacity:0;
  z-index:50;
  pointer-events:none;
  transition:opacity .35s;
}
body.opening .fade{opacity:.35}

@media(max-width:430px){
  .book-area{width:96vw;height:90dvh}
  .open-button{bottom:4vh}
}
</style>
</head>
<body>
<div class="scene">
  <div class="glow"></div>

  <div class="book-area">
    <div class="book" id="book">
      <img class="book-cover" src="libro-yina.png" alt="Yina XV Años">
      <div class="shine"></div>
    </div>
  </div>
</div>

<button class="open-button" id="openButton" type="button">ABRIR AQUÍ</button>
<div class="fade"></div>

<script>
(function(){
  const book = document.getElementById("book");
  const button = document.getElementById("openButton");
  let opened = false;

  function openBook(event){
    if(event) event.preventDefault();
    if(opened) return;
    opened = true;

    button.classList.add("hide");
    document.body.classList.add("opening");

    // The cover visibly rotates from the spine.
    book.classList.add("open");

    // Go DIRECTLY to the real Canva website. No intermediate image/page.
    setTimeout(function(){
      window.location.href = "https://xn--invitacin-isabel-y-david-nmc.my.canva.site/quince-a-os-yinna";
    }, 1750);
  }

  button.addEventListener("click", openBook);
  button.addEventListener("touchend", openBook, {passive:false});

  // Also allow tapping the cover itself.
  book.addEventListener("click", openBook);
})();
</script>
</body>
</html>
