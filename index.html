<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Yina — XV Años</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{
  background:#160107;
  display:flex;align-items:center;justify-content:center;
  font-family:Georgia,"Times New Roman",serif;
  -webkit-tap-highlight-color:transparent;
}
.scene{
  position:relative;width:100vw;height:100dvh;
  display:flex;align-items:center;justify-content:center;
  perspective:1800px;overflow:hidden;
  background:
    radial-gradient(circle at 50% 43%,#8f1426 0%,#430611 45%,#160107 100%);
}
.glow{
  position:absolute;width:95vmin;height:95vmin;border-radius:50%;
  background:radial-gradient(circle,rgba(255,195,90,.18),transparent 68%);
  filter:blur(10px);pointer-events:none;
}
.book-wrap{
  position:relative;width:min(94vw,560px);height:min(92vh,840px);
  display:flex;align-items:center;justify-content:center;
  perspective:1800px;
}
.book{
  position:relative;width:100%;height:100%;max-width:560px;max-height:840px;
  transform-style:preserve-3d;transform-origin:left center;
  cursor:pointer;filter:drop-shadow(0 25px 35px rgba(0,0,0,.7));
  transition:transform 1.15s cubic-bezier(.72,.02,.16,1);
  will-change:transform;z-index:10;
}
.cover{
  position:absolute;inset:0;width:100%;height:100%;object-fit:contain;
  object-position:center;backface-visibility:hidden;
  -webkit-backface-visibility:hidden;user-select:none;-webkit-user-drag:none;
}
.shine{
  position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(105deg,transparent 35%,rgba(255,230,160,0) 44%,rgba(255,230,160,.35) 50%,rgba(255,230,160,0) 56%,transparent 65%);
  opacity:0;
}
.book.opening{transform:rotateY(-78deg) translateX(-3%)}
.book.opening .shine{animation:shine 1s ease-in-out}
@keyframes shine{
  0%,100%{opacity:0;transform:translateX(-45%)}
  35%{opacity:1}70%{opacity:.15}100%{transform:translateX(45%)}
}

.pages{
  position:absolute;
  left:50%;top:50%;
  width:min(94vw,560px);height:min(92vh,840px);
  transform:translate(-50%,-50%);
  transform-style:preserve-3d;
  z-index:4;
  opacity:0;
}
.page{
  position:absolute;inset:0;
  border-radius:3px;
  overflow:hidden;
  transform-origin:left center;
  transform-style:preserve-3d;
  backface-visibility:hidden;
  background:
    radial-gradient(circle at 50% 50%,rgba(210,42,55,.98),rgba(104,8,24,.99) 72%),
    #740b1d;
  box-shadow:
    inset 0 0 0 2px rgba(255,213,117,.8),
    inset 0 0 0 10px rgba(116,7,25,.45),
    0 12px 28px rgba(0,0,0,.55);
}
.page::before{
  content:"";
  position:absolute;inset:2.5%;
  border:2px solid rgba(245,205,113,.82);
  border-radius:2px;
  box-shadow:inset 0 0 30px rgba(255,215,120,.13);
}
.page::after{
  content:"✦   ❦   ✦";
  position:absolute;left:0;right:0;top:50%;
  transform:translateY(-50%);
  text-align:center;color:rgba(255,220,135,.8);
  font-size:34px;letter-spacing:.55em;
  text-shadow:0 0 14px rgba(255,190,80,.55);
}
.page:nth-child(1){z-index:7}
.page:nth-child(2){z-index:6}
.page:nth-child(3){z-index:5}
.page:nth-child(4){z-index:4}
.page:nth-child(5){z-index:3}
.page:nth-child(6){z-index:2}

body.flipping .pages{opacity:1}
body.flipping .page:nth-child(1){animation:flip 0.48s cubic-bezier(.55,.05,.45,1) .05s forwards}
body.flipping .page:nth-child(2){animation:flip 0.48s cubic-bezier(.55,.05,.45,1) .34s forwards}
body.flipping .page:nth-child(3){animation:flip 0.48s cubic-bezier(.55,.05,.45,1) .63s forwards}
body.flipping .page:nth-child(4){animation:flip 0.48s cubic-bezier(.55,.05,.45,1) .92s forwards}
body.flipping .page:nth-child(5){animation:flip 0.48s cubic-bezier(.55,.05,.45,1) 1.21s forwards}
body.flipping .page:nth-child(6){animation:flip 0.48s cubic-bezier(.55,.05,.45,1) 1.50s forwards}

@keyframes flip{
  0%{transform:rotateY(0deg);box-shadow:inset 0 0 0 2px rgba(255,213,117,.8),20px 0 35px rgba(0,0,0,.18)}
  45%{transform:rotateY(-82deg);box-shadow:inset 0 0 0 2px rgba(255,213,117,.8),-10px 0 35px rgba(0,0,0,.28)}
  100%{transform:rotateY(-178deg);box-shadow:inset 0 0 0 2px rgba(255,213,117,.8),-20px 0 35px rgba(0,0,0,.12)}
}

.final-page{
  position:fixed;inset:0;z-index:1;
  display:flex;align-items:center;justify-content:center;
  opacity:0;transform:scale(1.04);
  transition:opacity .35s ease,transform .45s ease;
  pointer-events:none;
}
.final-page img{width:100%;height:100%;object-fit:cover;object-position:center}
body.reveal .final-page{opacity:1;transform:scale(1)}

.tap-area{
  position:absolute;left:12%;right:12%;bottom:9%;height:14%;
  z-index:20;border:0;background:transparent;cursor:pointer;border-radius:30px;
}
.hint{
  position:absolute;bottom:2.2%;left:50%;transform:translateX(-50%);
  color:#ffe9ad;font:600 12px Arial,sans-serif;letter-spacing:.12em;
  text-transform:uppercase;text-shadow:0 2px 10px #000;white-space:nowrap;
  pointer-events:none;z-index:21;
}
body.opened .hint{display:none}
.fade{
  position:fixed;inset:0;background:#170006;opacity:0;pointer-events:none;
  z-index:30;transition:opacity .35s ease;
}
body.opening .fade{opacity:.15}

@media (max-width:430px){
  .book-wrap,.pages{width:96vw;height:94dvh}
}
@media (max-height:650px){
  .book-wrap,.pages{width:86vw;height:92dvh}
}
</style>
</head>
<body>
<div class="scene">
  <div class="glow"></div>

  <div class="final-page">
    <img src="paginas-rojas-yina.png" alt="Interior rojo y dorado de la invitación">
  </div>

  <div class="pages" aria-hidden="true">
    <div class="page"></div><div class="page"></div><div class="page"></div>
    <div class="page"></div><div class="page"></div><div class="page"></div>
  </div>

  <div class="book-wrap">
    <div class="book" id="book" role="button" tabindex="0" aria-label="Abrir invitación">
      <img class="cover" src="libro-yina.png" alt="Yina — XV Años">
      <div class="shine"></div>
      <button class="tap-area" id="openBtn" aria-label="Abrir aquí"></button>
    </div>
    <div class="hint">Toca “Abrir aquí”</div>
  </div>
</div>
<div class="fade"></div>

<script>
const book=document.getElementById('book');
const btn=document.getElementById('openBtn');
let opened=false;

function openInvitation(e){
  if(e)e.preventDefault();
  if(opened)return;
  opened=true;
  document.body.classList.add('opened','opening');
  book.classList.add('opening');

  // Al terminar de abrir la portada, pasan varias hojas rápidamente.
  setTimeout(()=>document.body.classList.add('flipping'),850);

  // Mostramos el interior rojo y dorado un instante y luego abrimos Canva.
  setTimeout(()=>document.body.classList.add('reveal'),2450);
  setTimeout(()=>{
    window.location.assign('https://xn--invitacin-isabel-y-david-nmc.my.canva.site/quince-a-os-yinna');
  },3150);
}

btn.addEventListener('click',openInvitation);
book.addEventListener('click',e=>{if(e.target!==btn)openInvitation(e)});
book.addEventListener('keydown',e=>{
  if(e.key==='Enter'||e.key===' ')openInvitation(e);
});
</script>
</body>
</html>
