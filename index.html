<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Yina — XV Años</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{
  background:radial-gradient(circle at 50% 44%,#8d1428 0%,#470711 48%,#160106 100%);
}
.scene{
  position:relative;width:100vw;height:100dvh;
  display:flex;align-items:center;justify-content:center;
  perspective:2400px;overflow:hidden;
}
.book{
  position:relative;
  width:min(94vw,560px);
  height:min(92vh,840px);
  transform-style:preserve-3d;
  filter:drop-shadow(0 28px 40px rgba(0,0,0,.75));
}
.book-surface{
  position:absolute;inset:0;
  transform-style:preserve-3d;
}

/* Fixed spine: it never rotates. */
.spine{
  position:absolute;
  left:0;top:0;
  width:12%;
  height:100%;
  z-index:5;
  overflow:hidden;
  background:#7e0b20;
}
.spine img{
  width:100%;
  height:100%;
  object-fit:fill;
  display:block;
}

/* The front cover is a real hinged panel.
   Its left edge is exactly at the spine. */
.front{
  position:absolute;
  left:12%;
  top:0;
  width:88%;
  height:100%;
  transform-origin:left center;
  transform-style:preserve-3d;
  transition:transform 1.9s cubic-bezier(.72,.02,.15,1);
  z-index:10;
}
.front.open{
  transform:rotateY(-168deg);
}
.front img{
  width:100%;
  height:100%;
  object-fit:fill;
  display:block;
  backface-visibility:hidden;
  -webkit-backface-visibility:hidden;
  user-select:none;
  -webkit-user-drag:none;
}

/* Inside/back of the hinged cover */
.front-back{
  position:absolute;inset:0;
  transform:rotateY(180deg);
  backface-visibility:hidden;
  -webkit-backface-visibility:hidden;
  background:
    radial-gradient(circle at 50% 45%,#9b1730 0%,#710a20 64%,#4a0614 100%);
  border:2px solid #d7aa55;
}
.front-back:before{
  content:"";
  position:absolute;inset:3%;
  border:2px solid rgba(255,220,140,.75);
}
.front-back:after{
  content:"❦";
  position:absolute;left:0;right:0;top:50%;
  transform:translateY(-50%);
  text-align:center;color:#efc970;font-size:36px;
}

/* Subtle white/red page edges behind the opening cover */
.pages{
  position:absolute;
  left:12%;top:1%;
  width:88%;height:98%;
  border-radius:0 5px 5px 0;
  background:
    repeating-linear-gradient(
      0deg,
      #e7d7b4 0px,#fff5dc 2px,#d1bd94 4px
    );
  box-shadow:inset 0 0 30px rgba(0,0,0,.25);
  z-index:2;
}

/* Hinge shadow */
.hinge-shadow{
  position:absolute;
  left:12%;top:0;width:88%;height:100%;
  z-index:11;
  pointer-events:none;
  transform-origin:left center;
  opacity:0;
  background:linear-gradient(90deg,rgba(0,0,0,.60),transparent 48%);
}
.front.open ~ .hinge-shadow{
  animation:hingeShadow 1.9s cubic-bezier(.72,.02,.15,1) forwards;
}
@keyframes hingeShadow{
  0%{opacity:0;transform:rotateY(0)}
  18%{opacity:.7}
  55%{opacity:.35}
  100%{opacity:0;transform:rotateY(-168deg)}
}

/* The clickable area is exactly the printed ABRIR AQUÍ region,
   but invisible. No extra visible button is created. */
.tap{
  position:absolute;
  left:34%;
  top:70%;
  width:45%;
  height:11%;
  z-index:30;
  border:0;background:transparent;
  cursor:pointer;
  border-radius:50px;
  padding:0;margin:0;
  touch-action:manipulation;
}

.hint{
  position:fixed;
  left:50%;bottom:1.5%;
  transform:translateX(-50%);
  color:#ffe9ad;
  font:600 11px Arial,sans-serif;
  letter-spacing:.1em;
  text-transform:uppercase;
  text-shadow:0 2px 10px #000;
  pointer-events:none;
  z-index:40;
  opacity:.85;
}
body.opened .hint{display:none}

.fade{
  position:fixed;inset:0;z-index:50;
  background:#170006;opacity:0;
  pointer-events:none;transition:opacity .4s;
}
body.opening .fade{opacity:.2}

@media(max-width:430px){
  .book{width:96vw;height:94dvh}
}
@media(max-height:650px){
  .book{width:86vw;height:92dvh}
}
</style>
</head>
<body>
<div class="scene">
  <div class="book" id="book">
    <div class="book-surface">
      <div class="pages"></div>

      <div class="spine">
        <img src="lomo-yina.png" alt="">
      </div>

      <div class="front" id="front">
        <img src="portada-yina.png" alt="Yina XV Años">
        <div class="front-back"></div>
      </div>

      <div class="hinge-shadow"></div>

      <button class="tap" id="tap" aria-label="Abrir aquí"></button>
    </div>
  </div>
</div>

<div class="fade"></div>
<div class="hint">Toca “ABRIR AQUÍ”</div>

<script>
const front=document.getElementById("front");
const tap=document.getElementById("tap");
let opened=false;

function openBook(e){
  if(e)e.preventDefault();
  if(opened)return;
  opened=true;

  tap.style.pointerEvents="none";
  document.body.classList.add("opened","opening");

  // REAL hinge: the spine stays fixed and only the cover panel turns.
  front.classList.add("open");

  setTimeout(function(){
    window.location.href="https://xn--invitacin-isabel-y-david-nmc.my.canva.site/quince-a-os-yinna";
  },2100);
}

tap.addEventListener("click",openBook);
tap.addEventListener("touchend",openBook,{passive:false});
</script>
</body>
</html>
